# The Android app's own version (1.5.0, release candidate). From 1.5.0 the Android app and the desktop and
# web version (package.json) are released together as GizeCat 1.5.0, the Living Companion release. The file
# stays the single source for the Android versionName and versionCode (docs/platforms/android-overlay.md,
# "Version"), so a later Android-only update can again move ahead of package.json.
#
# versionName   shown to users, and the version of the bundled web app's About line.
# versionCode   must increase with every APK anyone can install over an earlier one. The earlier trial APKs
#               were 10400 (1.4.0), 10401 (1.4.0-overlay.1), 10402 (1.4.1) and 10403 (1.4.2); this one is
#               10500 (MAJOR*10000 + MINOR*100 + PATCH, the floor the Gradle build enforces from
#               package.json). Never lower it, and never reuse a value.
versionName=1.5.0
versionCode=10500
