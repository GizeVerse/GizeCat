<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;overflow:hidden}</style></head>
<body><canvas id="c"></canvas><script>
const c=document.getElementById('c');const ctx=c.getContext('2d');
function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';}
fit();let frames=0;
function loop(t){frames++;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.scale(devicePixelRatio,devicePixelRatio);
const x=200+150*Math.sin(t/700);ctx.fillStyle='rgba(240,140,40,1)';ctx.beginPath();ctx.ellipse(x,innerHeight-60,50,35,0,0,Math.PI*2);ctx.fill();requestAnimationFrame(loop);}
requestAnimationFrame(loop);setInterval(()=>{document.title='f'+frames;frames=0},1000);
</script></body></html>
