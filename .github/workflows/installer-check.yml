  #       shell: pwsh
  #       run: |
  #         $old = Get-ChildItem out/installers/old -Filter 'Desktop-Cat-Setup-*.exe' | Select-Object -First 1
  #         $new = Get-ChildItem out/installers/new -Filter 'Desktop-Cat-Setup-*-arm64.exe' | Select-Object -First 1
