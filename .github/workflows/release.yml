name: release-artifacts

# UNEXECUTED when written (2026-11-07). The repository had no remote before its publication,
# so GitHub Actions had never run this workflow, and nothing below had been observed to pass or
# fail on a hosted runner. A person must check the first real run, and inspect every file it produces, before
# any of them is shared.
#
# Manual only (workflow_dispatch). It builds unsigned packages and uploads them as workflow
# artifacts with actions/upload-artifact, nothing else:
# - it never creates a GitHub release and never publishes (`--publish never`);
# - it never signs (no certificate; CSC_IDENTITY_AUTO_DISCOVERY=false);
# - it uses no secrets.
#
# The Linux job depends on the `linux:` section and the per-OS packaging changes planned in
# ADR 0004 section 11 (docs/adr/0004-gizeverse-platform.md); electron-builder.yml has neither
# yet. Until they land, expect that job to fail or to produce a package that is not fit to
# ship. A Linux package that builds is not evidence that the app runs on Linux
# (CONTRIBUTING.md, platform statuses).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1.4.0, UNEXECUTED like the rest of this file: one NSIS installer per architecture,
  # Desktop-Cat-Setup-<version>-x64.exe and Desktop-Cat-Setup-<version>-arm64.exe, built on the x64
  # runner. The ARM64 one is only checked statically here (PE machine, koffi payload, asar header,
  # fuses); an x64 runner cannot run ARM64 binaries.
  windows:
    name: Windows NSIS installers (x64, ARM64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      # npm ci installs only the runner's own koffi binary; this adds the ARM64 one at the locked
      # version, refused unless its sha512 equals package-lock.json (package.json and the lockfile
      # stay unchanged).
      - name: Stage the ARM64 koffi binary
        run: node scripts/stage-koffi-arch.mjs --arch arm64
      - name: Build
        run: node scripts/build.mjs
      # The arch flags are required: without them electron-builder builds only the runner's arch.
      - name: Package NSIS installers, x64 and ARM64 (unsigned, not published)
        run: npx electron-builder --win nsis --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # One step per check: a pwsh step only fails on the exit code of its last command.
      - name: Static payload check, x64 (no binary is executed)
        run: node scripts/check-win-payload.mjs --arch x64 --dir release/win-unpacked
      - name: Static payload check, ARM64 (no binary is executed)
        run: node scripts/check-win-payload.mjs --arch arm64 --dir release/win-arm64-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux AppImage and tar.gz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - name: Build
        run: node scripts/build.mjs
      - name: Package AppImage and tar.gz (unsigned, not published)
        run: npx electron-builder --linux AppImage tar.gz --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-targz
          path: |
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 14
