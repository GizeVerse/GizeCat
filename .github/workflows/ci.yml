name: ci

# NOTE: this workflow has not been executed yet (the repository has no remote and
# GitHub Actions is unavailable for this account at the time of writing). It mirrors
# the commands that were run locally; see docs/TEST_REPORT.md.

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # No dependency needs an install script (koffi ships its prebuilt binary as an
      # optional dependency, esbuild uses its platform package, Electron's binary is
      # fetched explicitly below), so none are run.
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - name: Download Electron binary
        run: node node_modules/electron/install.js
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: End-to-end (Playwright, Electron)
        run: npx playwright test
      - name: Dependency audit (all dependencies; Electron and zod are devDependencies but ship)
        run: npm audit --audit-level=high

  package:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Package NSIS installer (unsigned)
        run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke-test the packaged exe
        run: node scripts/smoke-packaged.mjs
      - name: Install / uninstall validation
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-cat-installer
          path: release/*.exe
          if-no-files-found: error
