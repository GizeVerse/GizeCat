name: ci

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Download Electron binary
        run: node node_modules/electron/install.js
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: End-to-end (Playwright, Electron)
        run: npx playwright test
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

  package:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Package NSIS installer (unsigned)
        run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-cat-installer
          path: release/*.exe
          if-no-files-found: error
