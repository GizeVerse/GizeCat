appId: io.github.enesiltas.desktopcat
productName: Desktop Cat
copyright: Copyright © 2026 enesiltas
electronVersion: 44.9.3
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - "!out/preview/**"
  - "!out/native/**"
  # The web host is its own static build, not part of the desktop app (review H1).
  - "!out/web/**"
  - "!out/web-test/**"
  - assets/**/*
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - "!**/*.map"
asar: true
extraMetadata:
  main: out/main/index.js
# GizeVerse (ADR 0004 §11): every platform section lists its own native files. The Windows
# section carries exactly the entries that were top-level up to v1.2 (payload unchanged).
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  executableName: DesktopCat
  requestedExecutionLevel: asInvoker
  # UI Automation helper (browser tab strips), spawned from <resources>/native; absent when the
  # build machine has no csc.exe (the feature then reports itself unavailable).
  extraResources:
    - from: out/native/DesktopCatUia.exe
      to: native/DesktopCatUia.exe
  asarUnpack:
    - node_modules/koffi/**
    - node_modules/@koromix/koffi-win32-x64/**
# Linux (ADR 0004 §11): IMPLEMENTED_BUT_NOT_PLATFORM_VERIFIED; built in a container only.
# deb/rpm need a homepage and a maintainer e-mail, which the owner has not chosen yet.
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  category: Utility
  icon: build/icon.png
  # Frozen with the other identifiers (ADR 0004 §9): launchers and later autostart entries use it.
  executableName: desktop-cat
  synopsis: GizeCat, a desktop cat (GizeVerse)
  description: An animated cat in a transparent, click-through overlay. Shown only on X11 sessions with a compositing window manager.
  artifactName: GizeCat-${version}-linux-${arch}.${ext}
  # koffi binds libX11 for the compositor check (src/main/linux/x11Compositor.ts).
  asarUnpack:
    - node_modules/koffi/**
    - node_modules/@koromix/koffi-linux-x64/**
# macOS (ADR 0004 §11): IMPLEMENTED_BUT_NOT_PLATFORM_VERIFIED; needs a Mac to build, and a
# Developer ID plus notarization to distribute. koffi is not used on macOS, so it is not shipped.
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.utilities
  icon: build/icon.png
  artifactName: GizeCat-${version}-mac-${arch}.${ext}
  files:
    - "!node_modules/koffi/**"
    - "!node_modules/@koromix/**"
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Desktop Cat
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: Desktop Cat
  artifactName: Desktop-Cat-Setup-${version}.${ext}
  license: LICENSE
  include: build/installer.nsh
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
publish: null
