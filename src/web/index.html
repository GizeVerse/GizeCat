<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1814" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="GizeCat, a GizeVerse character: an animated cat to pet, pick up and keep you company." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GizeCat" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>GizeCat</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="web.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <h1 class="visually-hidden">GizeCat</h1>
    <!-- The first screen, CSS only (web.css; the page allows no inline script): main.js removes it when
         the cat starts. If that never happens (the script could not load, or the browser is too old to
         run it) the stylesheet replaces the waiting message with the failure message by itself. -->
    <div id="boot" class="boot" role="status">
      <div class="boot-wait">
        <span class="boot-spinner" aria-hidden="true"></span>
        <p>GizeCat is waking up.</p>
      </div>
      <p class="boot-failed">GizeCat has not started. If it stays like this, check your connection and open it again. GizeCat needs an up-to-date browser.</p>
    </div>
    <header class="bar">
      <div class="controls" role="group" aria-label="Cat controls">
        <button type="button" id="btn-call">Call the cat</button>
        <button type="button" id="btn-sleep">Sleep</button>
        <button type="button" id="btn-pause">Pause</button>
        <button type="button" id="btn-sound">Turn sound on</button>
        <button type="button" id="btn-settings" aria-haspopup="dialog" aria-controls="settings">Settings</button>
        <!-- The floating cat (Android app only; hidden everywhere else and filled by floatingUi.ts). -->
        <button type="button" id="btn-float" hidden>Float over apps</button>
        <button type="button" id="btn-f-pause" hidden>Pause floating cat</button>
        <button type="button" id="btn-f-hide" hidden>Hide floating cat</button>
        <button type="button" id="btn-f-stop" hidden>Stop floating cat</button>
      </div>
    </header>
    <p id="cat-status" class="visually-hidden" role="status" aria-live="polite"></p>
    <p id="floating-status" class="floating-status" role="status" aria-live="polite" hidden></p>
    <section id="floating-ask" class="floating-ask" hidden>
      <h2 id="floating-ask-title">Let your cat walk over other apps</h2>
      <div id="floating-ask-text"></div>
      <div class="actions">
        <button type="button" id="floating-ask-open" class="primary">Open Android settings</button>
        <button type="button" id="floating-ask-later">Not now</button>
      </div>
    </section>
    <noscript><p class="noscript">The cat needs JavaScript to live here.</p></noscript>
    <!-- Filled by src/web/settingsPanel.ts (About, privacy, storage and install notes live there). -->
    <dialog id="settings" class="sheet" aria-labelledby="settings-title"></dialog>
    <!-- Measures env(safe-area-inset-*) for src/web/safeArea.ts; never visible. -->
    <div id="safe-area-probe" aria-hidden="true"></div>
    <canvas id="cat" aria-hidden="true"></canvas>
  </body>
</html>
